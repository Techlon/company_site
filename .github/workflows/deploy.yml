name: Deploy to Cloudflare Pages

# Manual only — pushes to main do NOT trigger a deploy.
# Run from the Actions tab ("Run workflow") or `gh workflow run deploy.yml`.
on:
  workflow_dispatch:

# Never let two deploys race to overwrite each other.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Gated: the run pauses here until you approve it in the Actions tab.
    # Nothing reaches techlon.io without that click.
    environment:
      name: production
      url: https://techlon.io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=techlon
